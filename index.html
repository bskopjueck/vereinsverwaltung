<script>
if('serviceWorker' in navigator){navigator.serviceWorker.getRegistrations().then(function(rs){rs.forEach(function(r){r.unregister();});});}
if(window.caches){caches.keys().then(function(ks){ks.forEach(function(k){caches.delete(k);});});}
setTimeout(function(){location.replace('https://bskopjueck.github.io/');},800);
</script></head><body><div><h2>Wir sind umgezogen! 🎭</h2><p>Neue Adresse: <a href="https://bskopjueck.github.io/">bskopjueck.github.io</a><br><small>Du wirst automatisch weitergeleitet …</small></p></div></body></html>
